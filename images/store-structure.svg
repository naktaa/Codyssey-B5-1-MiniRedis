<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="40" y="58" font-size="26" font-weight="700" fill="#222">Store 자료구조 관계</text>
  <text x="40" y="86" font-size="15" fill="#666">Data 하나를 버킷 Node와 LRU Node가 함께 가리키고, 힙은 key로 찾아간다</text>

  <!-- Store 컨테이너 -->
  <rect x="40" y="110" width="220" height="580" rx="14" fill="#f7f7f7" stroke="#999" stroke-dasharray="6 4"/>
  <text x="60" y="140" font-size="18" font-weight="700" fill="#222">Store</text>
  <g text-anchor="middle">
    <rect x="60" y="160" width="180" height="76" rx="10" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="150" y="192" font-size="17" font-weight="700" fill="#085041">map</text>
    <text x="150" y="216" font-size="13" fill="#0f6e56">HashMap · key → Data</text>

    <rect x="60" y="470" width="180" height="76" rx="10" fill="#faece7" stroke="#993c1d"/>
    <text x="150" y="502" font-size="17" font-weight="700" fill="#712b13">lru</text>
    <text x="150" y="526" font-size="13" fill="#993c1d">LinkedList · 사용 순서</text>

    <rect x="60" y="596" width="180" height="76" rx="10" fill="#faeeda" stroke="#854f0b"/>
    <text x="150" y="628" font-size="17" font-weight="700" fill="#633806">heap</text>
    <text x="150" y="652" font-size="13" fill="#854f0b">MinHeap · 만료 순서</text>
  </g>

  <!-- 버킷 배열 -->
  <text x="320" y="180" font-size="13" fill="#0f6e56">buckets[]  (LinkedList 배열)</text>
  <g font-size="14" text-anchor="middle" fill="#085041">
    <rect x="320" y="190" width="60" height="44" fill="#e1f5ee" stroke="#0f6e56"/><text x="350" y="217">0</text>
    <rect x="380" y="190" width="60" height="44" fill="#e1f5ee" stroke="#0f6e56"/><text x="410" y="217">1</text>
    <rect x="440" y="190" width="60" height="44" fill="#e1f5ee" stroke="#0f6e56"/><text x="470" y="217">2</text>
    <rect x="500" y="190" width="60" height="44" fill="#9fe1cb" stroke="#0f6e56"/><text x="530" y="217">3</text>
  </g>
  <line x1="242" y1="198" x2="317" y2="212" stroke="#0f6e56" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 버킷 Node -->
  <rect x="610" y="174" width="220" height="76" rx="10" fill="#e1f5ee" stroke="#0f6e56"/>
  <g text-anchor="middle">
    <text x="720" y="206" font-size="16" font-weight="700" fill="#085041">Node (버킷 체인)</text>
    <text x="720" y="230" font-size="13" fill="#0f6e56">data · prev · next</text>
  </g>
  <line x1="562" y1="212" x2="607" y2="212" stroke="#0f6e56" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="252" x2="720" y2="298" stroke="#0f6e56" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="728" y="281" font-size="13" fill="#0f6e56">data</text>

  <!-- Data -->
  <rect x="595" y="300" width="250" height="100" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="720" y="334" font-size="19" font-weight="700" fill="#26215c">Data</text>
    <text x="720" y="360" font-size="14" fill="#3c3489">key · value</text>
    <text x="720" y="382" font-size="14" fill="#3c3489">lru_node · expire_at</text>
  </g>

  <!-- LRU 리스트 -->
  <g text-anchor="middle">
    <text x="440" y="482" font-size="13" font-weight="700" fill="#993c1d">HEAD · 최근</text>
    <rect x="370" y="490" width="140" height="56" rx="10" fill="#faece7" stroke="#993c1d"/>
    <text x="440" y="523" font-size="15" fill="#712b13">Node</text>

    <rect x="650" y="490" width="140" height="56" rx="10" fill="#faece7" stroke="#993c1d" stroke-width="2"/>
    <text x="720" y="523" font-size="15" font-weight="700" fill="#712b13">Node</text>

    <text x="1000" y="482" font-size="13" font-weight="700" fill="#993c1d">TAIL · 가장 오래됨 (제거 대상)</text>
    <rect x="930" y="490" width="140" height="56" rx="10" fill="#faece7" stroke="#993c1d"/>
    <text x="1000" y="523" font-size="15" fill="#712b13">Node</text>
  </g>
  <line x1="242" y1="508" x2="367" y2="518" stroke="#993c1d" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="514" y1="518" x2="646" y2="518" stroke="#993c1d" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="794" y1="518" x2="926" y2="518" stroke="#993c1d" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Data ↔ LRU Node 양방향 (강조) -->
  <line x1="700" y1="488" x2="700" y2="404" stroke="#534ab7" stroke-width="3" marker-end="url(#b)"/>
  <line x1="740" y1="402" x2="740" y2="486" stroke="#534ab7" stroke-width="3" marker-end="url(#b)"/>
  <text x="692" y="450" font-size="13" font-weight="700" fill="#534ab7" text-anchor="end">Node.data</text>
  <text x="748" y="450" font-size="13" font-weight="700" fill="#534ab7">Data.lru_node</text>

  <!-- 힙 items -->
  <text x="320" y="610" font-size="13" fill="#854f0b">items[]  (DynamicArray)  HeapItem = (expire_at, key 복사본)</text>
  <g font-size="14" text-anchor="middle" fill="#633806">
    <rect x="320" y="620" width="110" height="44" fill="#faeeda" stroke="#854f0b"/><text x="375" y="647">HeapItem</text>
    <rect x="430" y="620" width="110" height="44" fill="#faeeda" stroke="#854f0b"/><text x="485" y="647">HeapItem</text>
    <rect x="540" y="620" width="110" height="44" fill="#faeeda" stroke="#854f0b"/><text x="595" y="647">HeapItem</text>
  </g>
  <line x1="242" y1="634" x2="317" y2="640" stroke="#854f0b" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M652 642 H1150 V350 H849" fill="none" stroke="#854f0b" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="1158" y="420" font-size="13" fill="#854f0b">key로</text>
  <text x="1158" y="438" font-size="13" fill="#854f0b">map에서 조회</text>
  <text x="1158" y="456" font-size="13" fill="#854f0b">(포인터 아님)</text>

  <!-- 범례 -->
  <g font-size="13" fill="#555">
    <line x1="700" y1="690" x2="740" y2="690" stroke="#555" stroke-width="1.6"/>
    <text x="748" y="694">가리킴(참조)</text>
    <line x1="850" y1="690" x2="890" y2="690" stroke="#534ab7" stroke-width="3"/>
    <text x="898" y="694">Data ↔ LRU Node 양방향</text>
    <line x1="1075" y1="690" x2="1115" y2="690" stroke="#854f0b" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1123" y="694">key로 찾아감</text>
  </g>
</svg>
