<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <g transform="translate(0,45)">

  <g text-anchor="middle">
    <text x="640" y="72" font-size="26" font-weight="700" fill="#222">명령 처리 흐름</text>
    <text x="640" y="100" font-size="15" fill="#666">python/main.py → store.py / pubsub.py</text>

    <!-- 레인 라벨 -->
    <text x="640" y="162" font-size="13" font-weight="700" fill="#0f6e56">Store 명령 · SET GET DEL EXISTS DBSIZE KEYS EXPIRE TTL INFO CONFIG</text>
    <text x="640" y="322" font-size="13" font-weight="700" fill="#534ab7">Pub/Sub 명령</text>
    <text x="640" y="482" font-size="13" font-weight="700" fill="#a32d2d">에러</text>

    <!-- 입력 -->
    <rect x="130" y="330" width="140" height="80" rx="10" fill="#f2f2f2" stroke="#888"/>
    <text x="200" y="365" font-size="17" font-weight="700" fill="#222">입력</text>
    <text x="200" y="390" font-size="13" fill="#555">mini-redis&gt; 한 줄</text>

    <!-- Store -->
    <rect x="340" y="170" width="180" height="80" rx="10" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="430" y="205" font-size="17" font-weight="700" fill="#085041">1. 만료 정리</text>
    <text x="430" y="230" font-size="13" fill="#0f6e56">지난 키 삭제</text>
    <rect x="550" y="170" width="180" height="80" rx="10" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="640" y="205" font-size="17" font-weight="700" fill="#085041">2. 명령 실행</text>
    <text x="640" y="230" font-size="13" fill="#0f6e56">map · lru · heap 갱신</text>
    <rect x="760" y="170" width="180" height="80" rx="10" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="850" y="205" font-size="17" font-weight="700" fill="#085041">3. LRU 제거</text>
    <text x="850" y="230" font-size="13" fill="#0f6e56">SET만 · TAIL부터</text>
    <text x="640" y="276" font-size="13" fill="#666">SET: 엔트리 하나가 maxmemory보다 크면 OOM</text>

    <!-- Pub/Sub -->
    <rect x="340" y="330" width="285" height="80" rx="10" fill="#eeedfe" stroke="#534ab7"/>
    <text x="482" y="365" font-size="17" font-weight="700" fill="#3c3489">SUBSCRIBE</text>
    <text x="482" y="390" font-size="13" fill="#534ab7">channels(HashMap)에 채널 추가</text>
    <rect x="655" y="330" width="285" height="80" rx="10" fill="#eeedfe" stroke="#534ab7"/>
    <text x="797" y="365" font-size="17" font-weight="700" fill="#3c3489">PUBLISH</text>
    <text x="797" y="390" font-size="13" fill="#534ab7">inbox(LinkedList)에 넣고 바로 출력</text>

    <!-- 에러 -->
    <rect x="340" y="490" width="285" height="80" rx="10" fill="#fcebeb" stroke="#a32d2d"/>
    <text x="482" y="525" font-size="17" font-weight="700" fill="#791f1f">명령 오류</text>
    <text x="482" y="550" font-size="13" fill="#a32d2d">없는 명령 · 인자 개수</text>
    <rect x="655" y="490" width="285" height="80" rx="10" fill="#fcebeb" stroke="#a32d2d"/>
    <text x="797" y="525" font-size="17" font-weight="700" fill="#791f1f">값 오류</text>
    <text x="797" y="550" font-size="13" fill="#a32d2d">정수 아님 · 따옴표 짝 안 맞음</text>

    <!-- 출력 -->
    <rect x="1010" y="330" width="140" height="80" rx="10" fill="#f2f2f2" stroke="#888"/>
    <text x="1080" y="365" font-size="17" font-weight="700" fill="#222">출력</text>
    <text x="1080" y="390" font-size="13" fill="#555">Redis 스타일</text>
  </g>

  <g fill="none" stroke="#555" stroke-width="1.6">
    <path d="M272 370 H305 V210 H337" marker-end="url(#a)"/>
    <line x1="272" y1="370" x2="337" y2="370" marker-end="url(#a)"/>
    <path d="M305 370 V530 H337" marker-end="url(#a)"/>
    <line x1="522" y1="210" x2="547" y2="210" marker-end="url(#a)"/>
    <line x1="732" y1="210" x2="757" y2="210" marker-end="url(#a)"/>
    <path d="M942 210 H975 V370 H1007" marker-end="url(#a)"/>
    <line x1="942" y1="370" x2="1007" y2="370" marker-end="url(#a)"/>
    <path d="M942 530 H975 V370"/>
  </g>
  </g>
</svg>
